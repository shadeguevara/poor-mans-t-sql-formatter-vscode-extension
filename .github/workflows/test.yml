name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  integration:
    name: VS Code ${{ matrix.vscode-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode-version:
          - 1.142.0
          - 1.143.0
          - 1.144.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Compile, lint, and test
        run: xvfb-run -a npm test
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode-version }}
